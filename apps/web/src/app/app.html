<div class="app-shell" [class.bare]="fullBleed()">
  @if (!fullBleed()) {
    <header class="topbar">
      <p class="who">
        <strong>{{ name() }}</strong>
        <span>{{ roleLabel() }}</span>
      </p>

      <nav class="topbar-nav" aria-label="Sesión">
        @if (canManage()) {
          <a routerLink="/admin/dashboard">Volver al panel</a>
        }
        <button class="logout-button" type="button" (click)="logout()">Salir</button>
      </nav>
    </header>
  }

  <main class="main-content">
    <router-outlet />
  </main>
</div>
