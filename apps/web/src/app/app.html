<div class="app-shell" [class.bare]="edgeToEdge()">
  <a class="skip-link" href="#contenido" (click)="skipToContent($event)">Saltar al contenido</a>

  @if (!fullBleed()) {
    <header class="topbar">
      <p class="who">
        <strong>{{ name() }}</strong>
        <span>{{ roleLabel() }}</span>
      </p>

      <nav class="topbar-nav" aria-label="Sesión">
        @if (canManage()) {
          <a routerLink="/admin/dashboard">Volver al panel</a>
        }
        <button class="logout-button" type="button" (click)="logout()">Salir</button>
      </nav>
    </header>
  }

  <main class="main-content" id="contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>
